<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件智能助手</title>
    <link rel="stylesheet" href="/app.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/%3E%3Cpath d='M14 2v6h6'/%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
    <button id="toggle-session-drawer" class="icon-button" aria-label="打开会话列表">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="brand">
        <span class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><line x1="9.5" y1="13" x2="14.5" y2="13"/><line x1="9.5" y1="17" x2="12.5" y2="17"/></svg>
        </span>
        <span class="app-name">文件智能助手</span>
    </div>
    <button id="toggle-knowledge-drawer" class="icon-button" aria-label="打开知识库">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
    </button>
</header>

<main class="workbench">
    <aside id="session-panel" class="panel session-panel">
        <div class="panel-header">
            <h2>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                会话
            </h2>
            <button id="new-session-button" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="13" height="13" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                新建会话
            </button>
        </div>
        <ul id="session-list" class="session-list" aria-label="会话列表"></ul>
    </aside>

    <section id="chat-panel" class="panel chat-panel">
        <div class="chat-header">
            <h2 id="chat-title">未选择会话</h2>
        </div>
        <div id="message-list" class="message-list" aria-label="消息列表"></div>
        <form id="chat-form" class="chat-form">
            <textarea id="prompt-input" rows="2" placeholder="输入问题，Ctrl/⌘ + Enter 发送" autocomplete="off"></textarea>
            <div class="chat-actions">
                <button id="send-button" type="submit" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    发送
                </button>
                <button id="stop-button" type="button" hidden>
                    <svg viewBox="0 0 24 24" fill="currentColor" width="12" height="12" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                    停止
                </button>
            </div>
        </form>
    </section>

    <aside id="knowledge-panel" class="panel knowledge-panel">
        <div class="panel-header">
            <h2>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
                知识库
            </h2>
            <button id="upload-button" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                上传
            </button>
        </div>
        <ul id="knowledge-list" class="knowledge-list" aria-label="知识文件列表"></ul>
    </aside>
</main>

<dialog id="upload-dialog" class="upload-dialog">
    <form id="upload-form">
        <h3>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            上传知识文件
        </h3>
        <label>
            知识库名称
            <input id="upload-name" name="name" type="text" required placeholder="如：员工知识库">
        </label>
        <label>
            知识标签
            <input id="upload-tag" name="tag" type="text" required placeholder="如：制度">
        </label>
        <label>
            文件（支持 TXT/MD/PDF/DOCX/XLSX/CSV，可多选）
            <input id="upload-files" name="files" type="file" multiple required>
        </label>
        <p id="upload-error" class="upload-error" hidden></p>
        <div class="dialog-actions">
            <button type="button" id="upload-cancel" class="secondary">取消</button>
            <button type="submit">开始上传</button>
        </div>
    </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
