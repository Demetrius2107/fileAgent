name: CD - Release

# 持续交付：打 v* 标签时，构建可执行 jar 并发布 GitHub Release
# 用法：git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build executable jar (starter 模块)
        run: mvn -B -ntp -pl fileagent-starter -am package -DskipTests

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            自动生成的版本发布。

            - 构建产物：`fileagent-starter` 可执行 jar
            - 版本：`${{ github.ref_name }}`
            - 由 GitHub Actions CD 流水线自动生成
          files: |
            fileagent-starter/target/*.jar
          generate_release_notes: true
