server:
  port: 8080

spring:
  application:
    name: file-agent

  # Spring AI: OpenAI 兼容（通义/DeepSeek/OpenRouter 均可改 base-url）
  ai:
    openai:
      api-key: ${AI_API_KEY:sk-placeholder}
      base-url: ${AI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${AI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.2
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}

  # H2 文件数据库（元数据）
  datasource:
    url: jdbc:h2:file:./storage/db/fileagent;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# 业务配置
fileagent:
  storage-dir: ./storage/files
  vector-store-path: ./storage/vectorstore.json
  retrieval-top-k: 5
  retrieval-similarity-threshold: 0.7
  chat-history-limit: 10
  chunk-size: 800
  chunk-overlap: 120

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.demetrius.fileagent: DEBUG
    org.springframework.ai: INFO
