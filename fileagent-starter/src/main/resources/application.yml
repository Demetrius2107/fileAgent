server:
  port: 8080

spring:
  application:
    name: file-agent

  # Spring AI: DeepSeek Chat + 通义百炼 OpenAI 兼容 Embedding
  ai:
    model:
      chat: deepseek
      embedding: openai
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none
    deepseek:
      api-key: ${FILEAGENT_CHAT_API_KEY:sk-placeholder}
      base-url: ${FILEAGENT_CHAT_BASE_URL:https://api.deepseek.com}
      chat:
        model: ${FILEAGENT_CHAT_MODEL:deepseek-chat}
        temperature: 0.2
    openai:
      embedding:
        api-key: ${FILEAGENT_EMBEDDING_API_KEY:sk-placeholder}
        base-url: ${FILEAGENT_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        model: ${FILEAGENT_EMBEDDING_MODEL:text-embedding-v4}
        dimensions: ${FILEAGENT_EMBEDDING_DIMENSIONS:1024}

  # H2 文件数据库（元数据）
  datasource:
    url: jdbc:h2:file:./storage/db/fileagent;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  elasticsearch:
    uris: ${FILEAGENT_ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${FILEAGENT_ELASTICSEARCH_USERNAME:}
    password: ${FILEAGENT_ELASTICSEARCH_PASSWORD:}
    connection-timeout: 5s
    socket-timeout: 30s

# 业务配置
fileagent:
  storage-dir: ./storage/files
  vector-store-path: ./storage/vectorstore.json
  secret-key-path: ./storage/secret.key
  retrieval-top-k: 12
  retrieval-similarity-threshold: 0.55
  chat-history-limit: 10
  chunk-size: 800
  chunk-overlap: 120
  elasticsearch:
    index-alias: ${FILEAGENT_ELASTICSEARCH_INDEX_ALIAS:fileagent-knowledge}
    physical-index: ${FILEAGENT_ELASTICSEARCH_PHYSICAL_INDEX:fileagent-knowledge-v1}
    dimensions: ${FILEAGENT_EMBEDDING_DIMENSIONS:1024}
    embedding-batch-size: ${FILEAGENT_EMBEDDING_BATCH_SIZE:10}
    bm25-top-k: 50
    knn-top-k: 50
    knn-candidates: 100
    rrf-rank-constant: 60
    final-top-k: 12
  reranker:
    enabled: ${FILEAGENT_RERANKER_ENABLED:false}
    base-url: ${FILEAGENT_RERANKER_BASE_URL:}
    api-key: ${FILEAGENT_RERANKER_API_KEY:${FILEAGENT_EMBEDDING_API_KEY:}}
    model: ${FILEAGENT_RERANKER_MODEL:qwen3-rerank}
    candidate-top-k: 50
    top-n: 12

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.demetrius.fileagent: DEBUG
    org.springframework.ai: INFO
