server:
  port: 8080

spring:
  application:
    name: file-agent

  # Spring AI: DeepSeek Chat + 通义百炼 OpenAI 兼容 Embedding
  ai:
    model:
      chat: deepseek
      embedding: openai
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none
    deepseek:
      api-key: ${FILEAGENT_CHAT_API_KEY:sk-placeholder}
      base-url: ${FILEAGENT_CHAT_BASE_URL:https://api.deepseek.com}
      chat:
        model: ${FILEAGENT_CHAT_MODEL:deepseek-chat}
        temperature: 0.2
    openai:
      embedding:
        api-key: ${FILEAGENT_EMBEDDING_API_KEY:sk-placeholder}
        base-url: ${FILEAGENT_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        model: ${FILEAGENT_EMBEDDING_MODEL:text-embedding-v4}
        dimensions: ${FILEAGENT_EMBEDDING_DIMENSIONS:1024}

  # H2 文件数据库（元数据）
  datasource:
    url: jdbc:h2:file:./storage/db/fileagent;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# 业务配置
fileagent:
  storage-dir: ./storage/files
  vector-store-path: ./storage/vectorstore.json
  retrieval-top-k: 5
  retrieval-similarity-threshold: 0.7
  chat-history-limit: 10
  chunk-size: 800
  chunk-overlap: 120

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.demetrius.fileagent: DEBUG
    org.springframework.ai: INFO
